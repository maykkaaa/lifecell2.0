{% extends "base.html" %}

{% block title %}Реєстрація | Lifecell Portal{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Реєстрація
                    </h2>

                    <form method="post">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Зареєструватися
                        </button>
                    </form>

                    <p class="text-center mt-3">
                        Вже маєте акаунт?
                        <a href="{% url 'login' %}">
                            Увійти
                        </a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
